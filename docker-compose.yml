services:
  app:
    build: .
    env_file: .env
    environment:
      # Override khi chạy Docker — `qdrant` resolve qua Docker network DNS,
      # bất kể .env có ghi localhost (cho dev local) hay không.
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  qdrant_data:
