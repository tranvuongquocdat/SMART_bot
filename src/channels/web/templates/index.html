<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART_bot — Web Test Channel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/test/static/test.css" />
  <style>
    :root {
      --bg:         #0a0b0e;
      --panel:      #0f1014;
      --panel-2:    #13141a;
      --hover:      #1c1d24;
      --divider:    #07080b;
      --border:     #16171c;
      --fg:         #fafafa;
      --muted:      #9aa0aa;
      --dim:        #5e6470;
      --primary:    #14b8a6;
      --primary-2:  #22d3ee;
      --primary-soft: rgba(20, 184, 166, 0.12);
      --primary-soft-2: rgba(20, 184, 166, 0.22);
      --danger:     #ef4f4f;
    }
    html, body { background: var(--bg); color: var(--fg); }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    select, input { color: var(--fg); }
    select option { background: var(--panel-2); color: var(--fg); }
    ::placeholder { color: var(--dim); }
    .accent-gradient { background: linear-gradient(135deg, var(--primary), var(--primary-2)); }
    .accent-soft { background: var(--primary-soft); color: var(--primary); }
    .accent-soft:hover { background: var(--primary-soft-2); }
    .bubble-in { background: var(--panel-2); color: var(--fg); }
    .bubble-out { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #0a0a0a; }
  </style>
</head>
<body class="antialiased">
  <div id="app" class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-72 flex flex-col" style="background: var(--panel); border-right: 1px solid var(--divider);">
      <div class="p-3" style="border-bottom: 1px solid var(--divider);">
        <label class="text-[10px] uppercase tracking-wider" style="color: var(--dim);">Sending as</label>
        <select id="as-select" class="w-full mt-1 px-2 py-1.5 rounded text-sm" style="background: var(--panel-2); border: 1px solid var(--border);">
          <option value="">— chọn user —</option>
        </select>
        <button id="btn-add-user" class="accent-soft mt-2 w-full text-sm py-1.5 rounded transition-colors">+ Thêm user</button>
      </div>
      <div class="p-3 text-[10px] uppercase tracking-wider" style="color: var(--dim); border-bottom: 1px solid var(--divider);">DMs / Groups</div>
      <ul id="chat-list" class="flex-1 overflow-y-auto"></ul>
      <div class="p-3" style="border-top: 1px solid var(--divider);">
        <button id="btn-add-group" class="w-full text-sm py-1.5 rounded transition-colors" style="background: var(--panel-2); color: var(--fg); border: 1px solid var(--border);">+ Tạo nhóm</button>
        <button id="btn-admin" class="mt-2 w-full text-sm py-1.5 rounded transition-colors" style="background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);">⚙ Quản lý</button>
      </div>
    </aside>

    <!-- Chat panel -->
    <main class="flex-1 flex flex-col" style="background: var(--bg);">
      <header id="chat-header" class="px-4 py-3" style="background: var(--panel); border-bottom: 1px solid var(--divider);">
        <h2 class="font-semibold text-sm" style="color: var(--fg);">— chọn chat —</h2>
      </header>
      <ol id="messages" class="flex-1 overflow-y-auto px-4 py-3 space-y-2"></ol>
      <footer class="p-3" style="background: var(--panel); border-top: 1px solid var(--divider);">
        <div class="flex gap-2 items-center">
          <input id="msg-input" type="text" placeholder='Nhập tin nhắn... (gõ "@bot" để tag bot trong nhóm)'
                 class="flex-1 px-3 py-2 rounded text-sm focus:outline-none"
                 style="background: var(--panel-2); border: 1px solid var(--border);" />
          <button id="btn-send" class="accent-gradient px-4 py-2 rounded text-sm font-medium" style="color: #0a0a0a;">Gửi</button>
        </div>
      </footer>
    </main>

    <!-- Admin pane (collapsed) -->
    <aside id="admin-pane" class="w-80 hidden overflow-y-auto p-3" style="background: var(--panel); border-left: 1px solid var(--divider);">
      <div class="flex items-center justify-between">
        <h3 class="font-semibold text-sm">Quản lý</h3>
        <div class="flex gap-2 text-xs">
          <button id="btn-open-admin" class="px-2 py-1 rounded transition-colors disabled:opacity-40"
                  style="background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);"
                  title="Login as user đang chọn → mở /admin (cần Superadmin)">→ /admin</button>
          <button id="btn-open-app" class="px-2 py-1 rounded transition-colors disabled:opacity-40"
                  style="background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);"
                  title="Login as user đang chọn → mở /app (cần Boss hoặc Superadmin)">→ /app</button>
        </div>
      </div>
      <h4 class="font-medium mt-3 text-[10px] uppercase tracking-wider" style="color: var(--dim);">Users</h4>
      <ul id="admin-users" class="text-sm mt-1" style="border-top: 1px solid var(--border);"></ul>
      <h4 class="font-medium mt-4 text-[10px] uppercase tracking-wider" style="color: var(--dim);">Groups</h4>
      <ul id="admin-groups" class="text-sm mt-1" style="border-top: 1px solid var(--border);"></ul>
    </aside>
  </div>

  <!-- User create modal -->
  <div id="user-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="rounded-xl p-5 w-96 shadow-2xl" style="background: var(--panel-2); border: 1px solid var(--border);">
      <h3 class="font-semibold mb-3">Tạo user mới</h3>
      <label class="block text-xs mt-1" style="color: var(--muted);">Tên</label>
      <input id="user-modal-name" class="w-full mt-1 px-2 py-1.5 rounded focus:outline-none text-sm"
             style="background: var(--bg); border: 1px solid var(--border);" />
      <div class="mt-3 space-y-1.5 text-sm">
        <label class="flex items-center gap-2"><input type="radio" name="user-role" value="employee" checked /> Nhân viên</label>
        <label class="flex items-center gap-2"><input type="radio" name="user-role" value="boss" /> Boss (★)</label>
        <label class="flex items-center gap-2"><input type="radio" name="user-role" value="superadmin" /> Superadmin (✦) — vào /admin được</label>
      </div>
      <div class="mt-4 flex justify-end gap-2">
        <button id="user-modal-cancel" class="px-3 py-1.5 rounded text-sm" style="color: var(--muted);">Huỷ</button>
        <button id="user-modal-ok" class="accent-gradient px-4 py-1.5 rounded text-sm font-medium" style="color: #0a0a0a;">Tạo</button>
      </div>
    </div>
  </div>

  <!-- Group create modal -->
  <div id="group-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="rounded-xl p-5 w-96 shadow-2xl" style="background: var(--panel-2); border: 1px solid var(--border);">
      <h3 class="font-semibold mb-3">Tạo group mới</h3>
      <label class="block text-xs mt-1" style="color: var(--muted);">Tên</label>
      <input id="group-modal-name" class="w-full mt-1 px-2 py-1.5 rounded focus:outline-none text-sm"
             style="background: var(--bg); border: 1px solid var(--border);" />
      <label class="block text-xs mt-3" style="color: var(--muted);">Thành viên</label>
      <ul id="group-modal-members" class="mt-1 max-h-56 overflow-y-auto rounded text-sm"
          style="background: var(--bg); border: 1px solid var(--border);"></ul>
      <div class="mt-4 flex justify-end gap-2">
        <button id="group-modal-cancel" class="px-3 py-1.5 rounded text-sm" style="color: var(--muted);">Huỷ</button>
        <button id="group-modal-ok" class="accent-gradient px-4 py-1.5 rounded text-sm font-medium" style="color: #0a0a0a;">Tạo</button>
      </div>
    </div>
  </div>

  <script src="/test/static/test.js" type="module"></script>
</body>
</html>
