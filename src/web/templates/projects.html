{% extends "base.html" %}
{% block title %}Dự án — SMART_bot{% endblock %}
{% block body %}
<div class="max-w-6xl mx-auto p-6">
  <h1 class="text-2xl font-semibold mb-4">Dự án (nhóm theo trạng thái)</h1>
  <div class="bg-white border rounded">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-left">
        <tr><th class="p-2">Trạng thái</th><th class="p-2 text-center">Số nhóm</th></tr>
      </thead>
      <tbody>
        {% for r in rows %}
        <tr class="border-t"><td class="p-2">{{ r.status }}</td><td class="p-2 text-center">{{ r.n }}</td></tr>
        {% else %}
        <tr><td colspan="2" class="p-3 text-center text-gray-400">Chưa có dự án.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
