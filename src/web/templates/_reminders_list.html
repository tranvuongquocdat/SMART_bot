{# HTMX partial: list of pending reminders with cancel button #}
<table class="w-full text-sm">
  <thead class="bg-gray-50 text-left">
    <tr><th class="p-2">Khi</th><th class="p-2">Nội dung</th><th class="p-2">Phạm vi</th><th class="p-2"></th></tr>
  </thead>
  <tbody>
  {% set _rows = rows if rows is defined else pending %}
  {% for r in _rows %}
  <tr class="border-t">
    <td class="p-2 whitespace-nowrap">{{ r.due_at.strftime('%d/%m %H:%M') }}</td>
    <td class="p-2">{{ r.text }}</td>
    <td class="p-2 text-gray-500">{{ r.scope }}</td>
    <td class="p-2 text-right">
      <form method="post" action="/app/reminders/{{ r.id }}/cancel" class="inline">
        <input type="hidden" name="_csrf" value="{{ csrf_token }}">
        <button class="text-xs text-red-600 hover:underline">Hủy</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="4" class="p-3 text-center text-gray-400">Không có nhắc nào sắp tới.</td></tr>
  {% endfor %}
  </tbody>
</table>
