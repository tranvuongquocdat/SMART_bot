{% extends "base.html" %}
{% block title %}Admin · Agent triggers{% endblock %}
{% block body %}
<div class="max-w-6xl mx-auto p-6">
  <h1 class="text-2xl font-semibold mb-4">Admin · Agent triggers</h1>
  <div class="space-y-2">
    {% for r in rows %}
    <form method="post" action="/admin/agent-triggers/{{ r.id }}"
          class="bg-white border rounded p-3 grid grid-cols-12 gap-2 items-start text-sm">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="col-span-2">
        <div class="font-medium">{{ r.op_name }}</div>
        <div class="text-xs text-gray-500">{{ r.event_name }}</div>
      </div>
      <textarea name="debounce_json" rows="3"
        class="col-span-4 border rounded px-2 py-1 font-mono text-xs"
        placeholder='{"window_s": 30}'>{{ r.debounce_json|tojson if r.debounce_json is mapping else (r.debounce_json or '') }}</textarea>
      <textarea name="threshold_json" rows="3"
        class="col-span-4 border rounded px-2 py-1 font-mono text-xs"
        placeholder='{"min_count": 3}'>{{ r.threshold_json|tojson if r.threshold_json is mapping else (r.threshold_json or '') }}</textarea>
      <label class="col-span-1 text-xs flex items-center gap-1">
        <input type="checkbox" name="enabled" {% if r.enabled %}checked{% endif %}> on
      </label>
      <button class="col-span-1 bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded">Lưu</button>
    </form>
    {% else %}
    <p class="text-gray-400 text-center">Chưa có trigger.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
