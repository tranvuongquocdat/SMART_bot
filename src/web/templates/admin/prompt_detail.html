{% extends "base.html" %}
{% block title %}Prompt · {{ row.key }} v{{ row.version }}{% endblock %}
{% block body %}
<div class="max-w-4xl mx-auto p-6">
  <a href="/admin/prompts" class="text-sm text-gray-500">← Danh sách</a>
  <h1 class="text-2xl font-semibold mt-2 mb-4">{{ row.key }} <span class="text-base text-gray-500">v{{ row.version }}</span></h1>
  <pre class="bg-white border rounded p-4 whitespace-pre-wrap font-mono text-sm">{{ row.body }}</pre>
  {% if row.notes %}<p class="text-sm text-gray-500 mt-3">{{ row.notes }}</p>{% endif %}
</div>
{% endblock %}
