{% extends "base.html" %}
{% block title %}Admin · LLM routes{% endblock %}
{% block body %}
<div class="max-w-6xl mx-auto p-6">
  <h1 class="text-2xl font-semibold mb-4">Admin · LLM routes</h1>
  <div class="space-y-2">
    {% for r in rows %}
    <form method="post" action="/admin/llm-routes/{{ r.id }}"
          class="bg-white border rounded p-3 grid grid-cols-12 gap-2 items-center text-sm">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="col-span-2 font-medium">{{ r.feature }}</div>
      <input name="target_tier" value="{{ r.target_tier }}" class="col-span-2 border rounded px-2 py-1" placeholder="tier">
      <input name="fallback_chain" value='{{ r.fallback_chain|tojson if r.fallback_chain is iterable and r.fallback_chain is not string else r.fallback_chain }}'
             class="col-span-4 border rounded px-2 py-1 font-mono text-xs" placeholder='["tier1","tier2"]'>
      <input name="weight" type="number" value="{{ r.weight }}" class="col-span-1 border rounded px-2 py-1">
      <label class="col-span-1 text-xs flex items-center gap-1">
        <input type="checkbox" name="is_active" {% if r.is_active %}checked{% endif %}> on
      </label>
      <button class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded">Lưu</button>
    </form>
    {% else %}
    <p class="text-gray-400 text-center">Chưa có route.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
