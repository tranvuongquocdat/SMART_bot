{% extends "base.html" %}
{% block title %}Admin · Feature budgets{% endblock %}
{% block body %}
<div class="max-w-6xl mx-auto p-6">
  <h1 class="text-2xl font-semibold mb-4">Admin · Feature budgets</h1>
  <div class="space-y-2">
    {% for r in rows %}
    <form method="post" action="/admin/feature-budgets/{{ r.feature }}"
          class="bg-white border rounded p-3 grid grid-cols-12 gap-2 items-center text-sm">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="col-span-2 font-medium">{{ r.feature }}</div>
      <label class="col-span-2 text-xs">In tokens
        <input name="max_input_tokens" type="number" value="{{ r.max_input_tokens }}" class="w-full border rounded px-2 py-1">
      </label>
      <label class="col-span-2 text-xs">Out tokens
        <input name="max_output_tokens" type="number" value="{{ r.max_output_tokens }}" class="w-full border rounded px-2 py-1">
      </label>
      <input name="compression_strategy" value="{{ r.compression_strategy }}" class="col-span-2 border rounded px-2 py-1" placeholder="none/summary">
      <input name="cache_prefix_hint" value="{{ r.cache_prefix_hint or '' }}" class="col-span-2 border rounded px-2 py-1" placeholder="cache hint">
      <button class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded">Lưu</button>
      <textarea name="trim_policy_json" rows="2"
        class="col-span-12 border rounded px-2 py-1 font-mono text-xs"
        placeholder='{"keep_last_n": 10}'>{{ r.trim_policy_json|tojson if r.trim_policy_json is mapping else r.trim_policy_json }}</textarea>
    </form>
    {% else %}
    <p class="text-gray-400 text-center">Chưa có budget.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
