{% extends "base.html" %}
{% block title %}Cài đặt chung — SMART_bot{% endblock %}
{% block body %}
<div class="max-w-2xl mx-auto p-6">
  <h1 class="text-2xl font-semibold mb-4">Cài đặt chung</h1>
  <form method="post" action="/legacy-app/settings/general" class="space-y-3 bg-white border rounded p-4">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label class="block">
      <span class="text-sm text-gray-600">Tên hiển thị</span>
      <input name="name" value="{{ boss.name or '' }}" class="w-full border rounded px-2 py-1 text-sm">
    </label>
    <label class="block">
      <span class="text-sm text-gray-600">Múi giờ</span>
      <input name="tz" value="{{ boss.tz }}" class="w-full border rounded px-2 py-1 text-sm">
    </label>
    <label class="block">
      <span class="text-sm text-gray-600">Ngôn ngữ</span>
      <select name="language" class="w-full border rounded px-2 py-1 text-sm">
        <option value="vi" {% if boss.language == 'vi' %}selected{% endif %}>Tiếng Việt</option>
        <option value="en" {% if boss.language == 'en' %}selected{% endif %}>English</option>
      </select>
    </label>
    <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded text-sm">Lưu</button>
  </form>
</div>
{% endblock %}
