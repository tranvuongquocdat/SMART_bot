[project]
name = "ai-secretary"
version = "0.1.0"
description = "AI Secretary — multi-platform LLM assistant (Telegram, Zalo, Messenger, WhatsApp, Web)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "httpx==0.28.1",
    "openai==1.82.0",
    "aiosqlite==0.21.0",
    "apscheduler==3.11.0",
    "pydantic-settings==2.9.1",
    "qdrant-client==1.14.2",
    "cryptography>=47.0.0",
    "ddgs>=9.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
