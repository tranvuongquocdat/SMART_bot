[project]
name = "smart-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "structlog>=24.4",
  "qdrant-client>=1.12",
  "apscheduler>=3.10",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "cryptography>=43",
  "passlib[bcrypt]>=1.7",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "openai>=1.51",
  "google-generativeai>=0.8",
  "trafilatura>=1.12",
  "yt-dlp>=2024.10",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=11.0",
  "pillow-heif>=0.18",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "mypy>=1.13",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
