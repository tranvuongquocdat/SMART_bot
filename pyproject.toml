[project]
name = "smart-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "structlog>=24.4",
  "qdrant-client>=1.12",
  "apscheduler>=3.10",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "cryptography>=43",
  "passlib[bcrypt]>=1.7",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "openai>=1.51",
  "google-generativeai>=0.8",
  "tiktoken>=0.8",
  "trafilatura>=1.12",
  "yt-dlp>=2024.10",
  "youtube-transcript-api>=1.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=11.0",
  "pillow-heif>=0.18",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "greenlet>=3.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "mypy>=1.13",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# main.py imports each API router right next to its include_router() call to keep
# the app wiring readable and to avoid import cycles — E402 is intentional here.
"src/main.py" = ["E402"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]  # resolves BaseSettings env-populated fields (no false "missing arg")
# Right-sizing: strict stays ON, but these mechanical-debt checks are relaxed to
# reach a green baseline on the existing code. They are the RATCHET TARGETS —
# re-enable per-module via [[tool.mypy.overrides]] as modules get fully annotated,
# then globally once the debt is paid down.
disallow_untyped_defs = false        # ~197: functions missing a return/param annotation
disallow_incomplete_defs = false
disallow_untyped_calls = false       # ~48: calls into the untyped functions above
disallow_any_generics = false        # ~302: bare dict / list without type params
disallow_untyped_decorators = false  # ~24: our @tool/@router factories aren't typed yet
warn_return_any = false              # ~43: returning Any

[[tool.mypy.overrides]]
# Third-party libraries that ship no type stubs / py.typed marker.
module = ["asyncpg.*", "apscheduler.*", "authlib.*", "google.generativeai.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
