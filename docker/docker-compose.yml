services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smart_bot
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
volumes:
  postgres_data:
  qdrant_data:
